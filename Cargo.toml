[package]
name = "amux"
version = "0.2.0"
edition = "2021"
description = "Terminal workflow manager for AI coding — orchestrates tmux with three-level zoom, spatial layout, and workspace switching"
license = "MIT"
repository = "https://github.com/byoungs/amux"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
nix = { version = "0.29", features = ["process", "signal", "term", "fs"] }
